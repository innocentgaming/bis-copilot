# Root Alembic configuration pointing to backend/alembic

[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_locations = backend/alembic/versions
output_encoding = utf-8
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/bis_copilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
