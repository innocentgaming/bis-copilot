# Root Alembic configuration pointing to backend/alembic

[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_locations = backend/alembic/versions
output_encoding = utf-8
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/bis_copilot

[logging]
default_level = INFO
