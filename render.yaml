services:
  - type: web
    name: bis-copilot-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: bis-copilot-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: bis-copilot-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: deterministic
      - key: RERANKER_ENABLED
        value: "false"
      - key: CACHE_ENABLED
        value: "true"

databases:
  - name: bis-copilot-postgres
    databaseName: bis_copilot
    user: postgres
    plan: free
