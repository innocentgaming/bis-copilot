# Alembic configuration file for BIS Copilot

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be considered valid
sourceless = false

# search path for versions directory
version_locations = %(here)s/alembic/versions

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# sqlalchemy.url is dynamically overridden from settings.SYNC_DATABASE_URL in env.py
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/bis_copilot

[post_write_hooks]

[logging]
default_level = INFO
